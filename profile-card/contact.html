<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact Us</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="main-header">
            <nav class="main-nav" data-testid="test-main-navigation">
                <ul>
                    <li><a href="index.html">Profile Card</a></li>
                    <li><a href="about.html">About Me</a></li>
                    <li>
                        <a href="contact.html" aria-current="page"
                            >Contact Us</a
                        >
                    </li>
                </ul>
            </nav>
        </header>

        <main class="contact-page">
            <h1 class="page-title">Contact Us</h1>

            <form id="contactForm" class="contact-form" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        data-testid="test-contact-name"
                        aria-describedby="error-full-name"
                        required
                    />
                    <p
                        id="error-full-name"
                        class="error-message"
                        data-testid="test-contact-error-name"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        data-testid="test-contact-email"
                        aria-describedby="error-email"
                        required
                    />
                    <p
                        id="error-email"
                        class="error-message"
                        data-testid="test-contact-error-email"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        data-testid="test-contact-subject"
                        aria-describedby="error-subject"
                        required
                    />
                    <p
                        id="error-subject"
                        class="error-message"
                        data-testid="test-contact-error-subject"
                        aria-live="polite"
                    ></p>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        data-testid="test-contact-message"
                        aria-describedby="error-message-text"
                        required
                    ></textarea>
                    <p
                        id="error-message-text"
                        class="error-message"
                        data-testid="test-contact-error-message"
                        aria-live="polite"
                    ></p>
                </div>

                <button
                    type="submit"
                    class="submit-button"
                    data-testid="test-contact-submit"
                >
                    Send Message
                </button>

                <p
                    id="successMessage"
                    class="success-message"
                    data-testid="test-contact-success"
                    aria-live="polite"
                    hidden
                >
                    Thank you for your message! We will get back to you shortly.
                </p>
            </form>
        </main>

        <script src="contact-script.js"></script>
    </body>
</html>
